[project]
name = "si-proteins-multivalent-electrolyte"
version = "2.0.0"
description = "Supporting information for: Anomalous protein-protein interactions in multivalent salt solution"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
# Lower bounds only; exact versions live in uv.lock.
dependencies = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4",
    "matplotlib>=3.8",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "numpy>=2",
    "scipy>=1.18.1",
]

[project.scripts]
# `uv run analysis`: regenerate figures from data/processed (skips MC runs)
analysis = "analysis.run:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/analysis"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
target-version = "py312"
# Default since ruff 0.6; explicit so notebooks are never silently skipped.
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F", "I", "UP", "B", "SIM",
    "PTH",      # pathlib over os.path: portable path handling
    "PLW1514",  # open() without encoding: default differs between OSes
    "D",        # docstrings on public API
]
# PLW1514 is a preview rule; enable just the explicitly selected ones.
preview = true
explicit-preview-rules = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Notebooks use markdown cells, and often import after explanatory cells.
"*.ipynb" = ["E402", "D"]
# Test names document intent.
"tests/**" = ["D"]
